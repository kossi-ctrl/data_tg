version: 2

models:
  - name: stg_population_totale
    description: Population totale du Togo nettoyée (années sans donnée exclues).
    columns:
      - name: annee
        description: Année de la mesure.
        tests:
          - not_null
          - unique

      - name: population_totale
        description: Population totale.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: code_pays
        tests:
          - accepted_values:
              arguments:
                values: ['TGO']

  - name: stg_acces_electricite_pct
    description: Pourcentage d'accès à l'électricité au Togo, nettoyé (années sans donnée exclues).
    columns:
      - name: annee
        description: Année de la mesure.
        tests:
          - not_null
          - unique

      - name: acces_electricite_pct
        description: Pourcentage de la population ayant accès à l'électricité (doit être entre 0 et 100).
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true

      - name: code_pays
        tests:
          - accepted_values:
              arguments:
                values: ['TGO']
